{% extends "base/default-page.html" %}

{% block content %}
<style>
    .dashboard-box {
        color: rgb(0, 255, 35);
        width: 200px;
        height: 50px;
        background-color: #2a2a2a;
        border: 1px solid rgb(123, 123, 123);
        border-radius: 5px;
        text-align: center;
        line-height: 50px;
        font-family: monospace;
        font-size: 20px;
        margin-bottom: 20px;
    }

    .table-container {
        margin-bottom: 20px;
    }
</style>

<div class="dashboard-box">
    DASHBOARD
</div>
<div class="table-container">
    <table class="ui selectable inverted table">
        <thead>
            <th style="color: rgb(0, 255, 35);">Rating</th>
            <th style="color: rgb(0, 255, 35);">Team</th>
            <th class="right aligned" style="color:rgb(0, 255, 35);">Score</th>
        </thead>
        <tbody>
            {% for user in users %}
            <tr>
                <td>{{ loop.index }}</td>
                <td>{{ user.team }}</td>
                <td class="right aligned">{{ user.score }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
